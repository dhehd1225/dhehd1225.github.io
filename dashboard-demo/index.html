<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 대시보드 — 매출·주문 분석</title>
<link rel="stylesheet" href="../assets/base.css">
<style>
/* ─── Page-level token overrides ─────────────────────────────── */
:root {
  --accent:      #3a4a6b;
  --accent-ink:  #2c3a55;
  --accent-soft: #e7eaf1;
  --wrap:        1080px;
}

/* ─── Top bar ────────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}
.shop-name {
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--accent-ink);
  letter-spacing: -0.025em;
}
.shop-sub {
  font-size: var(--fs-xs);
  color: var(--sub-2);
  font-weight: 400;
  margin-left: 8px;
}

/* ─── Period tablist ─────────────────────────────────────────── */
.period-toggle {
  display: flex;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.period-btn {
  padding: 6px 18px;
  font-size: var(--fs-sm);
  font-family: var(--font);
  font-weight: 500;
  background: none;
  border: none;
  border-right: 1px solid var(--line-2);
  cursor: pointer;
  color: var(--sub);
  line-height: 1;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.period-btn:last-child { border-right: none; }
.period-btn[aria-selected="true"] {
  background: var(--accent);
  color: #fff;
}
.period-btn:hover:not([aria-selected="true"]) {
  background: var(--panel);
  color: var(--ink);
}

/* ─── Main layout ────────────────────────────────────────────── */
.main { padding: 28px 0 72px; }

/* ─── Section label ──────────────────────────────────────────── */
.section-label {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--sub-2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* ─── KPI grid ───────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}
.kpi-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px 18px;
  transition: border-color var(--dur) var(--ease);
}
.kpi-card:hover { border-color: var(--line-2); }
.kpi-label {
  font-size: var(--fs-xs);
  color: var(--sub);
  font-weight: 500;
  margin-bottom: 6px;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.kpi-value {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  line-height: 1.15;
  margin-bottom: 5px;
  color: var(--ink);
}
.kpi-delta {
  font-size: var(--fs-xs);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  display: flex;
  align-items: center;
  gap: 3px;
  line-height: 1;
}
.kpi-delta .arrow { font-size: 0.6rem; }
.kpi-compare {
  color: var(--sub-2);
  font-weight: 400;
  font-family: var(--font);
  font-size: var(--fs-xs);
  margin-left: 2px;
}

/* ─── Charts row ─────────────────────────────────────────────── */
.charts-row {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 16px;
  margin-bottom: 32px;
  align-items: start;
}
.chart-panel {
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  background: var(--bg);
}
.chart-title {
  font-size: 0.875rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--ink);
  letter-spacing: -0.02em;
}

/* ─── SVG chart ──────────────────────────────────────────────── */
.chart-svg-wrap { position: relative; }
#main-chart { display: block; width: 100%; overflow: visible; }

.chart-tooltip {
  position: absolute;
  background: var(--ink-2);
  color: #fff;
  font-size: var(--fs-xs);
  font-family: var(--mono);
  padding: 5px 10px;
  border-radius: var(--r-sm);
  pointer-events: none;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 90ms var(--ease);
  z-index: 10;
  letter-spacing: 0;
}
.chart-tooltip.visible { opacity: 1; }

/* ─── Channel bars ───────────────────────────────────────────── */
.bar-list { display: flex; flex-direction: column; gap: 14px; }
.bar-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
  align-items: baseline;
}
.bar-name {
  font-size: var(--fs-sm);
  color: var(--ink);
  font-weight: 500;
}
.bar-val {
  color: var(--sub);
  font-family: var(--mono);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
}
.bar-track {
  height: 5px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 200ms var(--ease);
  opacity: 0.75;
}

/* ─── Table controls ─────────────────────────────────────────── */
.table-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.table-controls label { font-size: var(--fs-sm); color: var(--sub); font-weight: 500; }
.table-controls select { width: auto; font-size: var(--fs-sm); padding: 6px 10px; }

/* ─── Table wrapper ──────────────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.table-wrap table { min-width: 540px; font-size: var(--fs-sm); }
.table-wrap thead th {
  background: var(--panel);
  white-space: nowrap;
  font-weight: 600;
}
.table-wrap tbody tr:last-child td { border-bottom: none; }
.table-wrap tbody tr:hover td { background: var(--panel); }
.table-wrap td { vertical-align: middle; }

.th-sortable {
  cursor: pointer;
  user-select: none;
}
.th-sortable:hover { color: var(--ink); }
.sort-indicator {
  margin-left: 4px;
  font-size: 0.6rem;
  opacity: 0.35;
  font-family: var(--mono);
}
.th-sortable[aria-sort="ascending"]  .sort-indicator::after { content: ' \25B2'; opacity: 1; }
.th-sortable[aria-sort="descending"] .sort-indicator::after { content: ' \25BC'; opacity: 1; }
.th-sortable:not([aria-sort])        .sort-indicator::after { content: ' \25B2\25BC'; }

.order-no {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--sub);
}
.amount {
  font-family: var(--mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.timestamp {
  color: var(--sub-2);
  font-size: var(--fs-xs);
  font-family: var(--mono);
}
.empty-msg td { text-align: center; color: var(--sub-2); padding: 36px; font-size: var(--fs-sm); }

/* Status pills — bespoke variants on top of base .pill */
.pill-paid     { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--accent-soft); }
.pill-shipping { color: var(--up);         border-color: color-mix(in srgb, var(--up) 30%, var(--line)); }
.pill-cancel   { color: var(--down);       border-color: color-mix(in srgb, var(--down) 30%, var(--line)); }

/* ─── Disclaimer ─────────────────────────────────────────────── */
.disc-bar {
  margin-top: 40px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 16px;
  font-size: var(--fs-xs);
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--panel);
}
.disc-bar strong { color: var(--ink-2); }

/* ─── Responsive ─────────────────────────────────────────────── */
@media (max-width: 860px) {
  .kpi-grid    { grid-template-columns: repeat(3, 1fr); }
  .charts-row  { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .kpi-grid    { grid-template-columns: repeat(2, 1fr); }
  .period-btn  { padding: 6px 12px; }
}
@media (max-width: 400px) {
  .kpi-grid    { grid-template-columns: 1fr 1fr; }
  .kpi-value   { font-size: 1.2rem; }
}
</style>
</head>
<body>

<header class="topbar" role="banner">
  <div class="wrap">
    <div class="topbar-inner">
      <div>
        <span class="shop-name">마켓플로우</span>
        <span class="shop-sub">관리자 대시보드</span>
      </div>
      <div class="period-toggle" role="tablist" aria-label="분석 기간 선택">
        <button class="period-btn" role="tab" aria-selected="true"  data-period="today" id="tab-today" aria-controls="dashboard-main">오늘</button>
        <button class="period-btn" role="tab" aria-selected="false" data-period="7d"    id="tab-7d"    aria-controls="dashboard-main">7일</button>

      </div>

</header>

  <div class="wrap">

    <!-- KPI section -->
    <section aria-label="핵심 지표">

    <section class="charts-row" aria-label="매출 분석">

        <div class="chart-svg-wrap" role="img" aria-labelledby="main-chart-title">
          <svg id="main-chart" height="200" aria-hidden="true"></svg>
          <div class="chart-tooltip" id="chart-tooltip" role="tooltip"></div>
        </div>
      </div>
      <div class="chart-panel reveal d4" aria-label="채널별 매출 비중">
        <div class="chart-title">채널별 매출 비중</div>
        <div class="bar-list" id="channel-bars"></div>
      </div>
    </section>

    <!-- Orders section -->
    <section aria-label="최근 주문">
      <div class="section-label reveal d1">최근 주문</div>
      <div class="table-controls reveal d2">
        <label for="status-filter">상태 필터</label>
        <select id="status-filter">
          <option value="all">전체</option>
          <option value="결제완료">결제완료</option>

      <div class="table-wrap reveal d3">
        <table>
          <thead>
            <tr>
              <th scope="col">주문번호</th>
              <th scope="col">상품</th>
              <th scope="col" class="th-sortable num" id="th-amount" tabindex="0">금액 <span class="sort-indicator" aria-hidden="true"></span></th>
              <th scope="col">상태</th>
              <th scope="col">일시</th>

        </table>
      </div>
    </section>

    <div class="disc-bar reveal d4" role="note">
      <span>모든 데이터는 포트폴리오 시연용 가상 데이터입니다. 실제 거래 정보가 아닙니다.</span>
      <span>made by <strong>od1225</strong> &middot; 관리자 대시보드 &middot; 2026</span>
    </div>

  </div>
</main>

<script>
"use strict";
// ─── Mock data ────────────────────────────────────────────────────────────────

function buildMonthLabels(n) {
  const out = [];
  const base = new Date(2026, 7, 2);
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(base.getTime());
    d.setDate(base.getDate() - i);
    out.push((d.getMonth()+1)+'/'+(d.getDate()));
  }
  return out;
}
function buildMonthValues(n) {
  const out = [];
  let v = 3200000;
  const seed = _rng('month-vals');
  for (let i = 0; i < n; i++) {
    v += (seed() - 0.38) * 800000;
    v = Math.max(800000, Math.round(v / 10000) * 10000);
    out.push(v);
  }
  return out;
}

const PRODUCTS = [
  '울 블렌드 코트','레더 크로스백','캐시미어 니트','퍼피 슬링백',
  '테크 다운 점퍼','코튼 슬랙스','에코 숄더백','실크 블라우스',
  '헤리티지 스니커즈','워터프루프 파카','리넨 셔츠','로우 데님 팬츠',
];
const STATUS_POOL = ['결제완료','결제완료','결제완료','배송중','배송중','취소'];

function _rng(seed) {
  let s = 0;
  for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  if (s === 0) s = 1;
  return function() {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
}

function genOrders(count, seed) {
  const rng = _rng(seed);
  const out = [];
  const now = new Date(2026, 8, 1, 20, 14, 0);
  const maxMins = seed === 'today' ? 1440 : seed === '7d' ? 10080 : 43200;
  for (let i = 0; i < count; i++) {
    const mins = Math.floor(rng() * maxMins);
    const d = new Date(now.getTime() - mins * 60000);
    const ordNum = 2000000 + Math.floor(rng() * 900000);
    out.push({
      no: 'ORD-' + ordNum,
      product: PRODUCTS[Math.floor(rng() * PRODUCTS.length)],
      amount: (Math.floor(rng() * 18) + 2) * 10000 + Math.floor(rng() * 9) * 1000,
      status: STATUS_POOL[Math.floor(rng() * STATUS_POOL.length)],
      date: d,
    });
  }
  return out;
}

const DATASETS = {
  today: {
    kpi: {
      sales:    { value: 4872000,   delta: +8.3 },
      orders:   { value: 67,        delta: +12.1 },
      visitors: { value: 1204,      delta: -3.2 },
      cvr:      { value: 5.56,      delta: +0.4, pct: true },
      aov:      { value: 72716,     delta: +2.8 },
    },
    chart: {
      labels: ['00시','02시','04시','06시','08시','10시','12시','14시','16시','18시','20시','22시'],
      values: [0,0,12000,85000,310000,620000,880000,1050000,1240000,890000,560000,225000],
      datePrefix: '9월 1일',
    },
    channels: [
      {name:'네이버 쇼핑',pct:38},{name:'자사몰 직접',pct:27},{name:'카카오 쇼핑',pct:18},
      {name:'쿠팡 파트너스',pct:11},{name:'인스타그램',pct:6},
    ],
    orders: genOrders(24, 'today'),
  },
  '7d': {
    kpi: {
      sales:    { value: 31540000,  delta: +5.1 },
      orders:   { value: 412,       delta: +7.8 },
      visitors: { value: 9870,      delta: +1.4 },
      cvr:      { value: 4.17,      delta: -0.3, pct: true },
      aov:      { value: 76553,     delta: +3.1 },
    },
    chart: {
      labels: ['8/26','8/27','8/28','8/29','8/30','8/31','9/1'],
      values: [3820000,4210000,3990000,5140000,4880000,4760000,4740000],
      datePrefix: null,
    },
    channels: [
      {name:'네이버 쇼핑',pct:41},{name:'자사몰 직접',pct:25},{name:'카카오 쇼핑',pct:16},
      {name:'쿠팡 파트너스',pct:12},{name:'인스타그램',pct:6},
    ],
    orders: genOrders(40, '7d'),
  },
  '30d': {
    kpi: {
      sales:    { value: 128900000, delta: +14.7 },
      orders:   { value: 1836,      delta: +18.2 },
      visitors: { value: 47200,     delta: +9.3 },
      cvr:      { value: 3.89,      delta: +0.6, pct: true },
      aov:      { value: 70206,     delta: +2.1 },
    },
    chart: {
      labels: buildMonthLabels(30),
      values: buildMonthValues(30),
      datePrefix: null,
    },
    channels: [
      {name:'네이버 쇼핑',pct:40},{name:'자사몰 직접',pct:26},{name:'카카오 쇼핑',pct:17},
      {name:'쿠팡 파트너스',pct:11},{name:'인스타그램',pct:6},
    ],
    orders: genOrders(60, '30d'),
  },
};

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtWon(v) {
  if (v >= 100000000) return (v/100000000).toFixed(1)+'억원';
  if (v >= 10000) return Math.round(v/10000).toLocaleString('ko-KR')+'만원';
  return v.toLocaleString('ko-KR')+'원';
}
function fmtWonFull(v) { return v.toLocaleString('ko-KR')+'원'; }
function fmtDatetime(d) {
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mn = String(d.getMinutes()).padStart(2,'0');
  return mm+'/'+dd+' '+hh+':'+mn;
}
function fmtYAxis(v) {
  if (v >= 100000000) return (v/100000000).toFixed(0)+'억';
  if (v >= 10000) return Math.round(v/10000)+'만';
  return v === 0 ? '0' : v.toLocaleString('ko-KR');
}

const KPI_META = [
  {key:'sales',    label:'총 매출',     fmt:fmtWon},
  {key:'orders',   label:'주문 수',     fmt:v=>v.toLocaleString('ko-KR')+'건'},
  {key:'visitors', label:'방문자 수',   fmt:v=>v.toLocaleString('ko-KR')+'명'},
  {key:'cvr',      label:'전환율',      fmt:v=>v.toFixed(2)+'%'},
  {key:'aov',      label:'평균 객단가', fmt:fmtWon},
];

// ─── State ────────────────────────────────────────────────────────────────────
let currentPeriod = 'today';
let sortDir = null; // null | 'asc' | 'desc'
let statusFilter = 'all';

// ─── DOM helpers ──────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'style') node.style.cssText = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => {
    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
    else if (c) node.appendChild(c);
  });
  return node;
}
function setChildren(parent, children) {
  while (parent.firstChild) parent.removeChild(parent.firstChild);
  children.forEach(c => parent.appendChild(c));
}

// ─── KPI render ───────────────────────────────────────────────────────────────
function renderKPI(data) {
  const cards = KPI_META.map(m => {
    const d = data[m.key];
    const up = d.delta >= 0;
    const arrow = up ? '▲' : '▼';
    const suffix = d.pct ? 'pp' : '%';
    const deltaStr = arrow + ' ' + Math.abs(d.delta).toFixed(1) + suffix;

    const deltaEl = el('div', {
      class: 'kpi-delta ' + (up ? 'delta-up' : 'delta-down'),
      'aria-label': (up ? '상승' : '하락') + ' ' + Math.abs(d.delta).toFixed(1) + suffix + ' 전기 대비',
    });
    const arrowSpan = el('span', {'class': 'arrow', 'aria-hidden': 'true'});
    arrowSpan.textContent = arrow;
    const numText = document.createTextNode(' ' + Math.abs(d.delta).toFixed(1) + suffix);
    const cmpSpan = el('span', {'class': 'kpi-compare'});
    cmpSpan.textContent = ' 전기 대비';
    deltaEl.appendChild(arrowSpan);
    deltaEl.appendChild(numText);
    deltaEl.appendChild(cmpSpan);

    const card = el('div', {
      'class': 'kpi-card',
      'role': 'figure',
      'aria-label': m.label + ' ' + m.fmt(d.value),
    });
    card.appendChild(el('div', {'class': 'kpi-label', 'aria-hidden': 'true'}, m.label));
    card.appendChild(el('div', {'class': 'kpi-value', 'aria-hidden': 'true'}, m.fmt(d.value)));
    card.appendChild(deltaEl);
    return card;
  });
  setChildren(document.getElementById('kpi-grid'), cards);
}

// ─── SVG chart ────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  return e;
}

function renderChart(chartData, period) {
  const titleEl = document.getElementById('main-chart-title');
  titleEl.textContent = period === 'today' ? '시간대별 매출 추이' : '일자별 매출 추이';

  const svg = document.getElementById('main-chart');
  const { labels, values, datePrefix } = chartData;
  const n = values.length;

  const W = svg.parentElement.clientWidth || 580;
  const H = 200;
  const pL = 52, pR = 12, pT = 14, pB = 34;
  const cW = W - pL - pR, cH = H - pT - pB;

  const maxV = Math.max(...values);
  const range = maxV || 1;

  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  // defs: clip path so area fill stays within chart bounds
  const defs = svgEl('defs', {});
  const clip = svgEl('clipPath', {id: 'chart-clip'});
  clip.appendChild(svgEl('rect', {x: pL, y: pT, width: cW, height: cH}));
  defs.appendChild(clip);
  svg.appendChild(defs);

  // Y grid + labels (4 lines)
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const v = (maxV / ySteps) * i;
    const y = pT + cH - (v / range) * cH;
    svg.appendChild(svgEl('line', {
      x1: pL, x2: pL + cW, y1: y.toFixed(1), y2: y.toFixed(1),
      stroke: 'var(--line)', 'stroke-width': '1',
    }));
    const txt = svgEl('text', {
      x: (pL - 6).toFixed(1), y: (y + 4).toFixed(1),
      'text-anchor': 'end',
      fill: 'var(--sub-2)',
      'font-size': '10',
      'font-family': 'ui-monospace,monospace',
    });
    txt.textContent = fmtYAxis(v);
    svg.appendChild(txt);
  }

  // Compute points
  const pts = values.map((v, i) => ({
    x: pL + (n > 1 ? i / (n - 1) : 0.5) * cW,
    y: pT + cH - (v / range) * cH,
  }));

  const lineD = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaD = lineD
    + ' L' + pts[pts.length-1].x.toFixed(1) + ',' + (pT + cH)
    + ' L' + pts[0].x.toFixed(1) + ',' + (pT + cH) + ' Z';

  // Flat area fill — very low opacity, no gradient
  svg.appendChild(svgEl('path', {
    d: areaD,
    fill: 'var(--accent)',
    opacity: '0.06',
    'clip-path': 'url(#chart-clip)',
  }));

  // Line stroke
  svg.appendChild(svgEl('path', {
    d: lineD,
    fill: 'none',
    stroke: 'var(--accent)',
    'stroke-width': '1.75',
    'stroke-linejoin': 'round',
    'stroke-linecap': 'round',
  }));

  // Data-point markers — visual only. The chart is exposed to assistive tech as
  // a labelled image via the .chart-svg-wrap[role="img"] wrapper, so these SVG
  // nodes stay out of the tab order (no empty/unlabelled focus stops). The value
  // read-out is provided on hover by the hit-rects below.
  const markerGroup = svgEl('g', {});
  const dots = pts.map((p) => {
    const dot = svgEl('circle', {
      cx: p.x.toFixed(1),
      cy: p.y.toFixed(1),
      r: '3.5',
      fill: 'var(--accent)',
      opacity: '0',
      style: 'transition: opacity 90ms;',
    });
    markerGroup.appendChild(dot);
    return { dot };
  });
  svg.appendChild(markerGroup);

  // X labels (sparse)
  const step = Math.ceil(n / 7);
  labels.forEach((lb, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    const x = pL + (n > 1 ? i / (n - 1) : 0.5) * cW;
    const t = svgEl('text', {
      x: x.toFixed(1),
      y: H - pB + 16,
      'text-anchor': 'middle',
      fill: 'var(--sub-2)',
      'font-size': '10',
    });
    t.textContent = lb;
    svg.appendChild(t);
  });

  // Hover hit rects
  const hitW = n > 1 ? cW / (n - 1) : cW;
  const tooltip = document.getElementById('chart-tooltip');
  const wrap = svg.parentElement;

  pts.forEach((p, i) => {
    const r = svgEl('rect', {
      x: (p.x - hitW / 2).toFixed(1),
      y: pT,
      width: hitW.toFixed(1),
      height: cH,
      fill: 'transparent',
      style: 'cursor: crosshair;',
    });
    r.addEventListener('mouseenter', () => {
      dots[i].dot.setAttribute('opacity', '1');
      tooltip.textContent = labels[i] + '  ' + fmtWonFull(values[i]);
      tooltip.classList.add('visible');
      const wRect = wrap.getBoundingClientRect();
      const rRect = r.getBoundingClientRect();
      let left = rRect.left - wRect.left + hitW / 2;
      const top  = p.y - 38;
      if (left + 190 > wrap.clientWidth) left -= 190;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = top + 'px';
    });
    r.addEventListener('mouseleave', () => {
      dots[i].dot.setAttribute('opacity', '0');
      tooltip.classList.remove('visible');
    });
    svg.appendChild(r);
  });
}

// ─── Channel bars ─────────────────────────────────────────────────────────────
function renderChannels(channels) {
  const list = document.getElementById('channel-bars');
  const items = channels.map(c => {
    const fill = el('div', {'class': 'bar-fill', 'style': 'width:0%'});
    fill.dataset.w = c.pct;
    const item = el('div', {'class': 'bar-item',
      'role': 'meter',
      'aria-label': c.name + ' ' + c.pct + '% 매출 비중',
      'aria-valuenow': c.pct,
      'aria-valuemin': '0',
      'aria-valuemax': '100',
    });
    const meta = el('div', {'class': 'bar-meta'});
    meta.appendChild(el('span', {'class': 'bar-name'}, c.name));
    meta.appendChild(el('span', {'class': 'bar-val', 'aria-hidden': 'true'}, c.pct + '%'));
    item.appendChild(meta);
    item.appendChild(el('div', {'class': 'bar-track'}, fill));
    return item;
  });
  setChildren(list, items);
  requestAnimationFrame(() => {
    list.querySelectorAll('.bar-fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
  });
}

// ─── Orders table ─────────────────────────────────────────────────────────────
const PILL_MAP = {
  '결제완료': 'pill pill-paid',
  '배송중':   'pill pill-shipping',
  '취소':     'pill pill-cancel',
};

function renderOrders(orders) {
  let rows = orders.slice();
  if (statusFilter !== 'all') rows = rows.filter(o => o.status === statusFilter);
  if (sortDir === 'asc')  rows.sort((a, b) => a.amount - b.amount);
  if (sortDir === 'desc') rows.sort((a, b) => b.amount - a.amount);

  const th = document.getElementById('th-amount');
  if (!sortDir) {
    th.removeAttribute('aria-sort');
  } else {
    th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
  }

  const tbody = document.getElementById('order-tbody');
  if (rows.length === 0) {
    const empty = el('tr', {'class': 'empty-msg'});
    empty.appendChild(el('td', {colspan: '5'}, '해당 조건의 주문이 없습니다.'));
    setChildren(tbody, [empty]);
    return;
  }

  const trs = rows.map(o => {
    const pill = el('span', {'class': PILL_MAP[o.status] || 'pill'}, o.status);
    const amountTd = el('td', {'class': 'amount num'}, fmtWonFull(o.amount));
    return el('tr', null,
      el('td', {'class': 'order-no mono'}, o.no),
      el('td', null,                        o.product),
      amountTd,
      el('td', null,                        pill),
      el('td', {'class': 'timestamp'},      fmtDatetime(o.date))
    );
  });
  setChildren(tbody, trs);
}

// ─── Full render ──────────────────────────────────────────────────────────────
function render(period) {
  const data = DATASETS[period];
  renderKPI(data.kpi);
  renderChart(data.chart, period);
  renderChannels(data.channels);
  renderOrders(data.orders);
}

// ─── Events ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentPeriod = btn.dataset.period;
    sortDir = null;
    statusFilter = 'all';
    document.getElementById('status-filter').value = 'all';
    document.querySelectorAll('.period-btn').forEach(b => {
      b.setAttribute('aria-selected', 'false');
    });
    btn.setAttribute('aria-selected', 'true');
    render(currentPeriod);
  });
  // keyboard: arrow keys within tablist
  btn.addEventListener('keydown', e => {
    const tabs = [...document.querySelectorAll('.period-btn')];
    const idx = tabs.indexOf(btn);
    let next = -1;
    if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
    if (e.key === 'ArrowLeft')  next = (idx - 1 + tabs.length) % tabs.length;
    if (next >= 0) { e.preventDefault(); tabs[next].focus(); tabs[next].click(); }
  });
});

document.getElementById('status-filter').addEventListener('change', e => {
  statusFilter = e.target.value;
  renderOrders(DATASETS[currentPeriod].orders);
});

const thAmount = document.getElementById('th-amount');
thAmount.addEventListener('click', () => {
  sortDir = (sortDir === 'asc') ? 'desc' : 'asc';
  renderOrders(DATASETS[currentPeriod].orders);
});
thAmount.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); thAmount.click(); }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderChart(DATASETS[currentPeriod].chart, currentPeriod), 120);
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
render('today');
</script>
</body>
